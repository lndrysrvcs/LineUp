name: Vitest

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: latest

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: lineup-client/pnpm-lock.yaml

      - name: Install libraries
        run: pnpm install
        working-directory: lineup-client

      - name: Run tests
        run: npx vitest run
        working-directory: lineup-client
